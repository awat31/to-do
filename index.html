<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bright Tasks — To-Do List</title>
<style>
  /* ---------- Colour scheme: light background + bright accents ---------- */
  :root {
    --bg: #fdfbf7;            /* light cream background */
    --surface: #ffffff;
    --ink: #2b2d42;
    --ink-soft: #6b6f85;
    --line: #ece8e0;

    --coral:  #ff6b6b;        /* high priority */
    --amber:  #ffb627;        /* medium priority */
    --teal:   #2ec4b6;        /* low priority */
    --violet: #9b5de5;        /* accents */
    --sky:    #4cc9f0;        /* links / focus */
    --pink:   #f15bb5;

    --radius: 14px;
    --shadow: 0 2px 10px rgba(43, 45, 66, 0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 8% -10%, rgba(155, 93, 229, 0.10), transparent 45%),
      radial-gradient(circle at 95% 0%,  rgba(255, 182, 39, 0.12), transparent 40%),
      radial-gradient(circle at 50% 110%, rgba(46, 196, 182, 0.10), transparent 45%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 28px; }

  h1 {
    font-size: 2.2rem;
    letter-spacing: -0.5px;
  }
  h1 .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 3px; }
  .dot:nth-child(1) { background: var(--coral); }
  .dot:nth-child(2) { background: var(--amber); }
  .dot:nth-child(3) { background: var(--teal); }

  header p { color: var(--ink-soft); margin-top: 8px; font-size: 0.95rem; }

  /* ---------- Input row ---------- */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  input[type="text"] {
    flex: 1;
    padding: 14px 18px;
    font-size: 1rem;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--sky); }
  input[type="text"]::placeholder { color: #a7abbd; }

  select {
    padding: 14px 10px;
    font-size: 0.95rem;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--sky); }

  .add-btn {
    padding: 14px 22px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--violet);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }
  .add-btn:hover { background: #8a4ad0; }
  .add-btn:active { transform: scale(0.96); }

  /* ---------- Filters ---------- */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .filters { display: flex; gap: 6px; }

  .filter-btn {
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 2px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { background: #fff; }
  .filter-btn.active { background: var(--ink); color: #fff; }

  .count { font-size: 0.85rem; color: var(--ink-soft); }

  /* ---------- Task list ---------- */
  ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }

  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 2px solid var(--line);
    border-left-width: 6px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: pop-in 0.18s ease-out;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .task.done { opacity: 0.55; }
  .task.done .task-text { text-decoration: line-through; color: var(--ink-soft); }

  .task.high   { border-left-color: var(--coral); }
  .task.medium { border-left-color: var(--amber); }
  .task.low    { border-left-color: var(--teal); }

  /* Custom checkbox */
  .check {
    appearance: none;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border: 2px solid #c9cdd9;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: all 0.15s;
  }
  .check:hover { border-color: var(--sky); }
  .check:checked { background: var(--teal); border-color: var(--teal); }
  .check:checked::after {
    content: "✓";
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }

  .task-text { flex: 1; font-size: 1rem; word-break: break-word; cursor: default; }

  .priority-tag {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
    flex-shrink: 0;
  }
  .tag-high   { background: var(--coral); }
  .tag-medium { background: var(--amber); }
  .tag-low    { background: var(--teal); }

  .delete-btn {
    background: none;
    border: none;
    font-size: 1.15rem;
    color: #b9bdc9;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--coral); background: #fff1f1; }

  /* ---------- Footer ---------- */
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }

  .clear-btn {
    background: none;
    border: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--pink);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .clear-btn:hover { background: #fdeaf5; }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
    font-size: 0.95rem;
  }
  .empty .big { font-size: 2.2rem; display: block; margin-bottom: 8px; }

  /* Progress bar */
  .progress {
    height: 8px;
    background: #eee9df;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 16px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--coral), var(--amber), var(--teal), var(--sky));
    transition: width 0.3s ease;
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Bright Tasks <span class="dot"></span><span class="dot"></span><span class="dot"></span></h1>
      <p>Stay on top of it — colourfully.</p>
    </header>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="What needs doing?" maxlength="200" />
      <select id="priority-select" title="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button class="add-btn" id="add-btn">Add</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>
      <span class="count" id="count"></span>
    </div>

    <ul id="task-list"></ul>

    <div class="footer-row">
      <span class="count" id="done-count"></span>
      <button class="clear-btn" id="clear-btn">Clear completed</button>
    </div>

    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </main>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "bright-tasks-v1";

  const input       = document.getElementById("task-input");
  const prioritySel = document.getElementById("priority-select");
  const addBtn      = document.getElementById("add-btn");
  const list        = document.getElementById("task-list");
  const countEl     = document.getElementById("count");
  const doneCountEl = document.getElementById("done-count");
  const clearBtn    = document.getElementById("clear-btn");
  const progressBar = document.getElementById("progress-bar");
  const filterBtns  = Array.from(document.querySelectorAll(".filter-btn"));

  let tasks = load();
  let filter = "all";

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      return Array.isArray(parsed) ? parsed : seed();
    } catch {
      return seed();
    }
  }

  function seed() {
    // A few starter tasks so the app doesn't look empty on first run.
    return [
      { id: 1, text: "Welcome! Click the circle to complete me.", priority: "medium", done: false },
      { id: 2, text: "Try adding your own task →",            priority: "low",    done: false },
      { id: 3, text: "This one is high priority",             priority: "high",   done: true  },
    ];
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render() {
    list.innerHTML = "";

    const visible = tasks.filter(function (t) {
      if (filter === "active") return !t.done;
      if (filter === "done")   return  t.done;
      return true;
    });

    if (visible.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.innerHTML = '<span class="big">🎉</span>' +
        (filter === "done" ? "Nothing completed yet." :
         filter === "active" ? "All caught up — nice!" : "No tasks yet. Add one above!");
      list.appendChild(li);
    }

    visible.forEach(function (task) {
      const li = document.createElement("li");
      li.className = "task " + task.priority + (task.done ? " done" : "");
      li.dataset.id = task.id;

      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "check";
      check.checked = task.done;
      check.setAttribute("aria-label", "Mark task complete");
      check.addEventListener("change", function () {
        task.done = check.checked;
        save();
        render();
      });

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const tag = document.createElement("span");
      tag.className = "priority-tag tag-" + task.priority;
      tag.textContent = task.priority;

      const del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "✕";
      del.title = "Delete task";
      del.setAttribute("aria-label", "Delete task");
      del.addEventListener("click", function () {
        tasks = tasks.filter(function (t) { return t.id !== task.id; });
        save();
        render();
      });

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(tag);
      li.appendChild(del);
      list.appendChild(li);
    });

    const done = tasks.filter(function (t) { return t.done; }).length;
    const total = tasks.length;

    countEl.textContent = total === 0 ? "" : visible.length + " shown";
    doneCountEl.textContent = total === 0 ? "" : done + " of " + total + " done";
    progressBar.style.width = total === 0 ? "0%" : Math.round((done / total) * 100) + "%";

    clearBtn.style.visibility = done > 0 ? "visible" : "hidden";
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    tasks.unshift({
      id: Date.now() + Math.random().toString(16).slice(2),
      text: text,
      priority: prioritySel.value,
      done: false,
    });
    input.value = "";
    save();
    render();
    input.focus();
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });

  prioritySel.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.dataset.filter;
      filterBtns.forEach(function (b) { b.classList.toggle("active", b === btn); });
      render();
    });
  });

  clearBtn.addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
