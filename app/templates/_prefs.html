{% macro hide_completed_toggle(next_url) %}
<form method="post" action="{{ url_for('main.set_hide_completed') }}" class="hide-done-toggle">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label class="toggle" title="Hide tasks that are already done">
    <input type="checkbox" name="hide" value="1" {{ 'checked' if hide_completed }}
           onchange="this.form.submit()">
    <span>Hide completed</span>
  </label>
</form>
{% endmacro %}
