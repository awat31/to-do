<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}To-Do{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('main.dashboard') }}"><span class="brand-dot"></span>To&#8209;Do</a>
    <nav class="nav">
      <a href="{{ url_for('main.dashboard') }}" class="{{ 'active' if request.endpoint == 'main.dashboard' }}">Dashboard</a>
      <a href="{{ url_for('calendarview.view', kind='day') }}" class="{{ 'active' if request.blueprint == 'calendarview' }}">Calendar</a>
      <a href="{{ url_for('tasks.index') }}" class="{{ 'active' if request.blueprint == 'tasks' }}">Tasks</a>
      <a href="{{ url_for('projects.index') }}" class="{{ 'active' if request.blueprint == 'projects' }}">Projects</a>
    </nav>
    <form method="post" action="{{ url_for('auth.logout') }}" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-ghost btn-sm" type="submit">Log out</button>
    </form>
  </div>
</header>

<main class="page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
